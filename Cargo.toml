[package]
name = "voicemixer-spk-router"
version = "1.0.9"
edition = "2021"
rust-version = "1.85"
publish = false

[[bin]]
name = "voicemixer-spk"
path = "src/main.rs"

[workspace]
members = ["crates/audio-engine"]
default-members = ["."]
resolver = "2"

[features]
default = ["edge-websocket"]
edge-websocket = ["dep:tokio", "audio_mixer_backend/edge-websocket"]

[dependencies]
audio_mixer_backend = { package = "voicemixer-audio-engine", path = "crates/audio-engine", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"], optional = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
tempfile = "3"
