<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceMixer 共通接続設定</title>
<form id="settings">
  <fieldset disabled>
    <legend>ブラウザ共通の接続設定</legend>
    <label>Backendポート <input name="port" type="number" min="1" max="65535" required></label><br>
    <label>認証トークン <input name="token" type="text" required autocomplete="off"></label><br>
    <p>Streamキーとタブ音声を戻す設定は、サイドパネルの各タブで設定します。</p>
    <p>変更は各タブの次回開始・再開時に適用します。送信中のタブは自動的に切り替えません。</p>
    <button>保存</button>
  </fieldset>
  <output role="status">設定を読み込み中です</output>
</form>
<script type="module" src="./options.ts"></script>
</html>
