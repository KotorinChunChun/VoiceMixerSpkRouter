[package]
name = "voicemixer-audio-engine"
version = "0.4.8"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "audio_mixer_backend"
path = "src/lib.rs"

[features]
default = ["edge-websocket"]
edge-websocket = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
tauri = []
testing = []

[dependencies]
arc-swap = "1.7"
crossbeam-channel = "0.5"
crossbeam-queue = "0.3"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
hound = "3.5"
memmap2 = "0.9"
mp3lame-encoder = "0.2.5"
oxiaudio-core = "0.2.1"
oxiaudio-decode = "0.2.1"
oxiaudio-encode = "0.2.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8.22", features = ["uuid1", "chrono"] }
sha2 = "0.10"
sysinfo = "0.38"
thiserror = "2"
tracing = "0.1"
tungstenite = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
uuid = { version = "1", features = ["serde", "v4"] }
nnnoiseless = { version = "0.5.2", default-features = false }

futures-util = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.30", optional = true }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_UI_Shell",
  "Win32_System_LibraryLoader",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_Storage_FileSystem"
] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = "0.5"
