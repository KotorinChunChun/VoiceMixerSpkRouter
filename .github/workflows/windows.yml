name: Windows
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - run: cargo test --locked --bin voicemixer-spk -- --test-threads=1
      - run: cargo build --locked --release --bin voicemixer-spk
      - run: npm --prefix browser-extension ci
      - run: npm --prefix browser-extension run build
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project maintenance/tests/Maintenance.Tests.csproj --artifacts-path target/maintenance-tests -- tmp/reservation-tests
